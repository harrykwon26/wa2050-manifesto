<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WA2050 Manifesto — Fogarty Ripple Leadership Legacy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  #fl-root {
    --orange: #FF8121;
    --purple-dark: #51255A;
    --purple-light: #EDD4F2;
    --ink: #1C1223;
    --ink-soft: #4A3F52;
    --paper: #FBF9FC;
    --paper-card: #FFFFFF;
    --line: #E4D9EA;
    --night-1: #0A0714;
    --night-2: #1B1130;
    --night-3: #2D1B3F;
    --star: #F5EFFA;
    --torch: #FFD98A;
    --box-neutral: #EFEAF2;
    --box-accent: #FDEEDC;

    font-family: 'Work Sans', system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    line-height: 1.5;
  }
  #fl-root *, #fl-root *::before, #fl-root *::after { box-sizing: inherit; }

  #fl-root .fl-display {
    font-family: 'Anton', 'Arial Narrow', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    line-height: 0.95;
  }

  #fl-root button { font-family: inherit; cursor: pointer; }
  #fl-root textarea, #fl-root input, #fl-root select {
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
  }
  #fl-root :focus-visible {
    outline: 3px solid var(--orange);
    outline-offset: 2px;
  }

  #fl-app { max-width: 1000px; margin: 0 auto; padding: 20px 20px 80px; }

  /* Header */
  #fl-header { margin-bottom: 14px; }
  #fl-header .fl-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--purple-dark); }
  #fl-header h1 { font-size: clamp(22px, 4vw, 32px); margin: 2px 0 0; color: var(--purple-dark); }

  /* Name bar */
  #fl-namebar { margin-bottom: 20px; }
  #fl-namebar input {
    width: 100%; max-width: 420px; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 9px 12px; background: var(--paper-card); font-weight: 600; color: var(--purple-dark);
  }
  #fl-namebar input:focus { border-color: var(--orange); }
  #fl-namebar label { font-size: 12px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .08em; display: block; margin-bottom: 6px; }

  /* Stepper */
  #fl-stepper { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
  #fl-stepper button {
    display: flex; align-items: center; gap: 8px;
    background: var(--paper-card); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 8px 16px 8px 8px;
    font-size: 13.5px; font-weight: 600; color: var(--ink-soft);
    transition: border-color .15s, color .15s, background .15s;
  }
  #fl-stepper button .fl-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--purple-light); color: var(--purple-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800;
  }
  #fl-stepper button.fl-active { border-color: var(--orange); color: var(--purple-dark); background: #FFF6EC; }
  #fl-stepper button.fl-active .fl-num { background: var(--orange); color: #fff; }
  #fl-stepper button:hover { border-color: var(--orange); }

  /* Cards / layout */
  #fl-root .fl-stage { display: none; animation: flFade .35s ease; }
  #fl-root .fl-stage.fl-visible { display: block; }
  @keyframes flFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  #fl-root .fl-stage-head { margin-bottom: 18px; }
  #fl-root .fl-stage-head .fl-kicker { color: var(--orange); font-weight: 700; font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; }
  #fl-root .fl-stage-head h2 { font-size: clamp(20px, 3.4vw, 28px); color: var(--purple-dark); margin: 4px 0 8px; }
  #fl-root .fl-stage-head p { color: var(--ink-soft); font-size: 15px; max-width: 68ch; }

  #fl-root .fl-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 780px) { #fl-root .fl-grid { grid-template-columns: 0.85fr 1.15fr; align-items: start; } }

  #fl-root .fl-card {
    background: var(--paper-card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 22px;
  }
  #fl-root .fl-visual-card { background: linear-gradient(180deg, #FBF3FE, #FBF9FC); }

  #fl-root label { display: block; font-size: 13px; font-weight: 700; color: var(--purple-dark); margin: 16px 0 6px; }
  #fl-root label:first-child { margin-top: 0; }
  #fl-root label .fl-hint { display: block; font-weight: 500; color: var(--ink-soft); font-size: 12.5px; margin-top: 2px; }
  #fl-root textarea, #fl-root input[type=text] {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px;
    background: var(--paper); resize: vertical;
  }
  #fl-root textarea:focus, #fl-root input[type=text]:focus { border-color: var(--orange); }

  /* 3S check */
  .fl-3s-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .fl-3s-chip {
    border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12.5px;
    font-weight: 700; color: var(--ink-soft); background: var(--paper-card); text-align: left; flex: 1; min-width: 130px;
  }
  .fl-3s-chip span { display: block; font-weight: 500; font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .fl-3s-chip.fl-on { border-color: var(--orange); background: #FFF6EC; color: var(--purple-dark); }

  /* Numbered root-cause groups (3 branches x 3 lines) */
  .fl-root-group { border: 1px dashed var(--line); border-radius: 10px; padding: 4px 12px; margin-bottom: 10px; background: var(--paper-card); }
  .fl-root-group-label { font-size: 11px; font-weight: 800; color: var(--orange); text-transform: uppercase; letter-spacing: .06em; padding-top: 8px; }
  .fl-root-line { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .fl-root-line:not(:last-child) { border-bottom: 1px dotted var(--line); }
  .fl-root-num { flex: 0 0 16px; font-weight: 800; color: var(--purple-dark); font-size: 12.5px; }
  #fl-root .fl-root-line input.fl-root-input { border: none; border-radius: 0; padding: 4px 2px; background: transparent; width: 100%; font-size: 13.5px; }
  #fl-root .fl-root-line input.fl-root-input:focus { outline: none; border-bottom: 1.5px solid var(--orange); }

  /* Standout Legacy Vision / Roundtable Feedback section */
  .fl-vision-hero {
    margin-top: 24px; border-radius: 22px; padding: 30px 32px;
    background: linear-gradient(135deg, #FFF6EC 0%, #FBF0FA 100%);
    border: 2px solid var(--orange);
  }
  .fl-vision-hero .fl-vision-kicker {
    font-family: 'Anton', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: .03em;
    color: var(--orange); font-size: clamp(22px, 3.4vw, 30px); margin-bottom: 4px;
  }
  .fl-vision-hero .fl-vision-note { color: var(--ink-soft); font-size: 13.5px; font-style: italic; margin-bottom: 18px; }
  .fl-vision-hero .fl-vision-label { font-size: 15px; color: var(--purple-dark); margin: 18px 0 8px; }
  .fl-vision-hero .fl-vision-label:first-of-type { margin-top: 0; }
  .fl-vision-hero .fl-vision-textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px;
    background: var(--paper-card); font-size: 18px; line-height: 1.5; color: var(--ink); resize: vertical;
  }
  .fl-vision-hero .fl-vision-textarea:focus { border-color: var(--orange); }

  /* Problem tree visual (SVG + overlaid chips) */
  .fl-tree3 { position: relative; width: 100%; max-width: 400px; margin: 0 auto; aspect-ratio: 340 / 680; }
  .fl-tree3-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fl-tree3 .fl-t3-node { position: absolute; transform: translate(-50%, -50%); z-index: 2; }
  .fl-tree3 .fl-t3-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); opacity: .7; }
  .fl-tree3 .fl-tree-chip { font-size: 11px; padding: 5px 9px; border-radius: 8px; font-weight: 700; max-width: 105px; text-align: center; line-height: 1.3; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .fl-tree3 .fl-tree-chip .fl-chip-divider { border-top: 1px dashed rgba(0,0,0,.18); margin: 4px 0; }
  .fl-tree3 .fl-effect-chip { background: var(--purple-light); color: var(--purple-dark); }
  .fl-tree3 .fl-root-tier1 { background: #F1E7E0; color: #6B4A2C; max-width: 145px; }
  .fl-tree3 .fl-root-tier2 { background: #EADFCF; color: #5C3E22; font-size: 10.5px; max-width: 135px; }
  .fl-tree3 .fl-root-tier3 { background: #E3D5BC; color: #4A3016; font-size: 10px; max-width: 125px; opacity: .92; }
  .fl-tree3 .fl-t3-trunk-wrap .fl-trunk { background: var(--orange); color: #fff; font-size: 12px; font-weight: 700; padding: 9px 16px; border-radius: 10px; text-align: center; white-space: normal; max-width: 250px; line-height: 1.3; }

  /* Pathway 2x2 */
  .fl-quad-wrap { display: flex; flex-direction: column; gap: 10px; }
  .fl-quad { position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; height: 190px; border-radius: 12px; overflow: hidden; }
  .fl-quad .fl-q { background: var(--purple-light); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 700; color: var(--purple-dark); padding: 6px; opacity: .55; transition: opacity .2s, background .2s; }
  .fl-quad .fl-q.fl-q-active { opacity: 1; background: var(--orange); color: #fff; }
  .fl-axis-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); font-weight: 600; padding: 0 2px; }

  .fl-pathway-options { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 6px; }
  @media (min-width: 560px) { .fl-pathway-options { grid-template-columns: 1fr 1fr; } }
  .fl-pathway-opt { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; text-align: left; background: var(--paper-card); }
  .fl-pathway-opt strong { display: block; color: var(--purple-dark); font-size: 13.5px; margin-bottom: 2px; }
  .fl-pathway-opt span { color: var(--ink-soft); font-size: 12.5px; }
  .fl-pathway-opt.fl-selected { border-color: var(--orange); background: #FFF6EC; }

  input[type=range] { width: 100%; accent-color: var(--orange); }

  /* Audience chips */
  .fl-chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .fl-audience-chip {
    border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 12.5px;
    font-weight: 700; color: var(--ink-soft); background: var(--paper-card);
  }
  .fl-audience-chip.fl-selected { border-color: var(--orange); background: #FFF6EC; color: var(--purple-dark); }

  /* Story of self/us/now visual */
  .fl-arc { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0 10px; }
  .fl-arc .fl-arc-step { flex: 1; text-align: center; }
  .fl-arc .fl-arc-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--purple-light); color: var(--purple-dark); font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; }
  .fl-arc .fl-arc-label { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); }

  /* Buttons */
  #fl-root .fl-btn {
    border: none; border-radius: 999px; padding: 10px 18px; font-size: 13.5px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 6px;
  }
  #fl-root .fl-btn-primary { background: var(--orange); color: #fff; }
  #fl-root .fl-btn-primary:hover { background: #E96F10; }
  #fl-root .fl-btn-ghost { background: transparent; border: 1.5px solid var(--line); color: var(--purple-dark); }
  #fl-root .fl-btn-ghost:hover { border-color: var(--purple-dark); }
  #fl-root .fl-btn-ghost.fl-btn-on { border-color: var(--orange); color: var(--orange); }
  #fl-root .fl-btn:disabled { opacity: .5; cursor: default; }
  #fl-root .fl-btn-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; align-items: center; }

  .fl-savebar { font-size: 12px; color: var(--ink-soft); margin-top: 8px; min-height: 16px; }

  /* ---------- MANIFESTO STAGE ---------- */
  .fl-view-toggle { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }

  .fl-brief-editor { margin-bottom: 26px; }
  .fl-brief-editor .fl-brief-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .fl-brief-field { margin-bottom: 16px; }
  .fl-brief-field label { color: var(--purple-dark); }
  .fl-brief-field textarea { min-height: 90px; }

  /* Print-style brief preview */
  .fl-brief-preview { max-width: 760px; margin: 0 auto; }
  .fl-brief-preview .fl-bp-title { font-size: clamp(24px, 4vw, 34px); color: var(--purple-dark); margin: 0 0 4px; }
  .fl-brief-preview .fl-bp-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  .fl-bp-box { border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }
  .fl-bp-box h4 { margin: 0 0 8px; font-size: 13.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--purple-dark); }
  .fl-bp-box p { margin: 0; font-size: 15px; color: var(--ink); line-height: 1.6; white-space: pre-wrap; }
  .fl-bp-box.fl-bp-neutral { background: var(--box-neutral); }
  .fl-bp-box.fl-bp-accent { background: var(--box-accent); }

  /* ---------- STORY MODE ---------- */
  #fl-story {
    background: linear-gradient(180deg, var(--night-1), var(--night-2) 55%, var(--night-3));
    border-radius: 20px; padding: 0; position: relative; overflow: hidden; color: var(--star);
  }
  #fl-story .fl-stars { position: absolute; inset: 0; background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.9), transparent),
      radial-gradient(1.5px 1.5px at 70% 15%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.8), transparent),
      radial-gradient(1.5px 1.5px at 85% 55%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 10% 85%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.5px 1.5px at 55% 40%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 92% 80%, rgba(255,255,255,.8), transparent),
      radial-gradient(1.5px 1.5px at 30% 55%, rgba(255,255,255,.6), transparent);
    background-repeat: repeat; background-size: 340px 340px; pointer-events: none; opacity: .8;
  }
  #fl-story .fl-torch {
    position: absolute; left: 50%; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,217,138,.16), rgba(255,217,138,0) 65%);
    transform: translate(-50%, -50%); pointer-events: none; transition: top .12s linear;
  }
  #fl-story .fl-story-inner { position: relative; z-index: 2; padding: 48px 28px 64px; }
  #fl-story .fl-story-section {
    max-width: 640px; margin: 0 auto 90px; opacity: 0; transform: translateY(24px);
    transition: opacity .7s ease, transform .7s ease;
  }
  #fl-story .fl-story-section.fl-visible { opacity: 1; transform: translateY(0); }
  #fl-story .fl-story-section:last-child { margin-bottom: 16px; }
  #fl-story .fl-story-eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--torch); font-weight: 700; margin-bottom: 10px; }
  #fl-story .fl-story-section h3 { font-size: clamp(24px, 5vw, 40px); margin: 0 0 14px; color: #fff; }
  #fl-story .fl-story-section p { font-size: 16px; color: #E3D9EC; line-height: 1.65; white-space: pre-wrap; }
  #fl-story .fl-story-section p + p { margin-top: 10px; }
  #fl-story .fl-story-vision { font-size: clamp(20px, 3.6vw, 28px); font-style: italic; color: #fff; border-left: 3px solid var(--torch); padding-left: 18px; }
  #fl-story .fl-hero { text-align: center; padding-top: 30px; }
  #fl-story .fl-hero .fl-story-eyebrow { justify-content: center; }
  #fl-story .fl-hero h3 { font-size: clamp(30px, 7vw, 54px); }
  #fl-story .fl-closing { text-align: center; color: #C9BBD6; font-size: 14px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.15); }

  @media (prefers-reduced-motion: reduce) {
    #fl-story .fl-story-section, #fl-root .fl-stage { transition: none !important; animation: none !important; }
    #fl-story .fl-torch { transition: none !important; }
  }

  #fl-storage-warning {
    display: none; background: #FBE9E9; border: 1px solid #E9B8B8; color: #7A2E2E;
    border-radius: 10px; padding: 12px 16px; font-size: 13px; margin-bottom: 18px;
  }
</style>
</head>
<body>

<div id="fl-root">
  <div id="fl-app">
    <div id="fl-storage-warning">Your browser isn't saving progress right now (private/incognito mode or storage is disabled). You can keep working, but refreshing or closing this tab may lose your answers — download your Word brief often as a backup.</div>

    <div id="fl-header">
      <div class="fl-eyebrow">Fogarty Ripple &middot; Leadership Legacy</div>
      <h1 class="fl-display">WA2050 Manifesto</h1>
    </div>

    <div id="fl-namebar">
      <label for="fl-meta-name">Group name</label>
      <input type="text" id="fl-meta-name" placeholder="e.g. Hien Tran &amp; Co.">
    </div>

    <div id="fl-stepper"></div>
    <div id="fl-stages"></div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'fogarty-legacy-manifesto-v1';

  const PATHWAYS = [
    { id: 'enterprise', label: 'Social Enterprise & Impact Business', desc: 'Create a product, service or venture that fixes the problem directly and sustains itself.' },
    { id: 'advocacy', label: 'Advocacy & Campaigning', desc: 'Shift public opinion and build movements through community organising and media.' },
    { id: 'policy', label: 'Policy & Government', desc: 'Work within or alongside government to change rules, funding or institutional priorities.' },
    { id: 'research', label: 'Research & Evidence', desc: 'Generate the data and proof that shifts how the problem is understood or addressed.' },
    { id: 'intrapreneurship', label: 'Intrapreneurship', desc: 'Drive change from within an existing organisation, department or institution.' },
    { id: 'community', label: 'Community & Grassroots Leadership', desc: 'Build locally, connect people, and create collective action from the ground up.' }
  ];

  const AUDIENCES = ['Government', 'Private Sector', 'Not-for-profit', 'Other'];

  const TREE_LINES_SVG =
    '<svg class="fl-tree3-lines" viewBox="0 0 340 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' +
      '<defs>' +
        '<linearGradient id="flSoil" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="#F1E7E0"/>' +
          '<stop offset="1" stop-color="#DCC7A8"/>' +
        '</linearGradient>' +
        '<linearGradient id="flTrunk" x1="0" y1="0" x2="1" y2="0">' +
          '<stop offset="0" stop-color="#8B5E34"/>' +
          '<stop offset="0.5" stop-color="#A9723F"/>' +
          '<stop offset="1" stop-color="#7A4E2A"/>' +
        '</linearGradient>' +
      '</defs>' +

      '<path d="M0,340 Q170,322 340,340 L340,680 L0,680 Z" fill="url(#flSoil)"/>' +
      '<path d="M0,340 Q170,322 340,340" fill="none" stroke="#C7A87F" stroke-width="2"/>' +

      '<g fill="none" stroke-linecap="round">' +
        '<path d="M170,340 Q100,400 50,450" stroke="#8B5E34" stroke-width="3.6" opacity=".95"/>' +
        '<path d="M170,340 Q172,430 175,520" stroke="#8B5E34" stroke-width="3.6" opacity=".95"/>' +
        '<path d="M170,340 Q240,400 300,460" stroke="#8B5E34" stroke-width="3.6" opacity=".95"/>' +
        '<path d="M110,395 q-10,6 -16,12" stroke="#8B5E34" stroke-width="1.3" opacity=".45"/>' +
        '<path d="M173,430 q6,10 10,16" stroke="#8B5E34" stroke-width="1.3" opacity=".45"/>' +
        '<path d="M235,400 q10,6 16,12" stroke="#8B5E34" stroke-width="1.3" opacity=".45"/>' +
      '</g>' +

      '<path d="M160,198 Q154,270 142,340 L198,340 Q186,270 180,198 Z" fill="url(#flTrunk)"/>' +
      '<path d="M168,205 L166,335" stroke="#6B4425" stroke-width="1.2" opacity=".5"/>' +
      '<path d="M176,208 L178,335" stroke="#6B4425" stroke-width="1.2" opacity=".5"/>' +

      '<g opacity=".6">' +
        '<circle cx="90" cy="70" r="46" fill="#CFE9D6"/>' +
        '<circle cx="170" cy="46" r="55" fill="#DFF0E3"/>' +
        '<circle cx="250" cy="70" r="46" fill="#BFE0C8"/>' +
        '<circle cx="130" cy="95" r="40" fill="#DFF0E3"/>' +
        '<circle cx="210" cy="95" r="40" fill="#CFE9D6"/>' +
      '</g>' +

      '<g fill="none" stroke-linecap="round">' +
        '<path d="M170,198 Q115,140 75,85" stroke="#7A9E80" stroke-width="3" opacity=".9"/>' +
        '<path d="M170,198 Q140,110 118,55" stroke="#7A9E80" stroke-width="3" opacity=".9"/>' +
        '<path d="M170,198 Q170,110 170,45" stroke="#7A9E80" stroke-width="3" opacity=".9"/>' +
        '<path d="M170,198 Q200,110 222,55" stroke="#7A9E80" stroke-width="3" opacity=".9"/>' +
        '<path d="M170,198 Q225,140 265,85" stroke="#7A9E80" stroke-width="3" opacity=".9"/>' +
      '</g>' +

      '<g opacity=".95">' +
        '<circle cx="40" cy="70" r="19" fill="#DCEEDD"/>' +
        '<circle cx="52" cy="78" r="12" fill="#9BCBA8"/>' +
        '<circle cx="110" cy="32" r="19" fill="#BFE0C8"/>' +
        '<circle cx="123" cy="42" r="12" fill="#7FB98E"/>' +
        '<circle cx="170" cy="18" r="20" fill="#DCEEDD"/>' +
        '<circle cx="182" cy="28" r="12" fill="#9BCBA8"/>' +
        '<circle cx="230" cy="32" r="19" fill="#BFE0C8"/>' +
        '<circle cx="217" cy="42" r="12" fill="#7FB98E"/>' +
        '<circle cx="300" cy="70" r="19" fill="#DCEEDD"/>' +
        '<circle cx="288" cy="78" r="12" fill="#9BCBA8"/>' +
      '</g>' +
    '</svg>';

  const BRANCH_POS = [[40,70],[110,32],[170,18],[230,32],[300,70]];
  const ROOT_POS = [[50,450],[175,520],[300,460]];
  const ROOT_TIER_CLASS = ['fl-root-tier1','fl-root-tier2','fl-root-tier3'];

  // ---------- Module state ----------
  let uiActive = 'summit1';
  let uiStoryView = 'story';
  let data = null;
  let storageAvailable = true;

  function emptyData(){
    return {
      meta: { name: '' },
      summit1: { challengeTitle: '', sizeable: false, solvable: false, overlooked: false, threeSReasoning: '', effects: '', rootCauses: '', consequence: '', vision: '', stakeholders: '' },
      summit2: { pathways: [], control: 3, speed: 3, idea: '', reasoning: '', possibleBecause: '', commitment: '', mentorNotes: '' },
      summit3: { audiences: [], contacts: '', whatWorked: '', whatToAdjust: '', self: '', us: '', now: '' },
      brief: { challengeText: '', visionText: '', pathwayText: '' }
    };
  }

  function withDefaults(saved){
    const base = emptyData();
    if (!saved) return base;
    base.meta = Object.assign(base.meta, saved.meta || {});
    base.summit1 = Object.assign(base.summit1, saved.summit1 || {});
    base.summit2 = Object.assign(base.summit2, saved.summit2 || {});
    base.summit3 = Object.assign(base.summit3, saved.summit3 || {});
    base.brief = Object.assign(base.brief, saved.brief || {});
    if (!Array.isArray(base.summit2.pathways)) base.summit2.pathways = [];
    if (!Array.isArray(base.summit3.audiences)) base.summit3.audiences = [];
    return base;
  }

  // ---------- Storage (plain browser localStorage — no account needed, saves per-device) ----------
  function checkStorageAvailable(){
    try {
      const testKey = '__fl_test__';
      localStorage.setItem(testKey, '1');
      localStorage.removeItem(testKey);
      return true;
    } catch(e) { return false; }
  }

  function loadData(){
    let saved = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) saved = JSON.parse(raw);
    } catch(e) { /* nothing saved yet, or storage unavailable */ }
    data = withDefaults(saved);
  }

  function saveDataNow(){
    if (!storageAvailable) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  }

  let saveTimer = null;
  function activeSaveBar(){
    const stage = document.getElementById('fl-stage-' + uiActive);
    return stage ? stage.querySelector('.fl-savebar') : null;
  }
  function scheduleSave(){
    const bar = activeSaveBar();
    if (bar) bar.textContent = storageAvailable ? 'Saving…' : 'Not saving — see warning above.';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      saveDataNow();
      const b = activeSaveBar();
      if (b) b.textContent = storageAvailable ? 'Saved just now' : 'Not saving — see warning above.';
    }, 400);
  }

  window.addEventListener('beforeunload', saveDataNow);

  // ---------- Helpers ----------
  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function joinLines(text, sep){
    return (text||'').split('\n').map(s=>s.trim()).filter(Boolean).join(sep);
  }
  function pathwayLabel(id){
    const p = PATHWAYS.find(p => p.id === id);
    return p ? p.label : '';
  }
  function pathwayLabels(ids){
    return (ids || []).map(id => pathwayLabel(id)).filter(Boolean).join(' + ');
  }

  // ---------- Problem tree visual ----------
  function pct(x,y){ return { left: (x/340*100).toFixed(2)+'%', top: (y/680*100).toFixed(2)+'%' }; }

  function rootLinesArray(text){
    const lines = (text || '').split('\n');
    const arr = [];
    for (let i=0;i<9;i++) arr.push(lines[i] !== undefined ? lines[i] : '');
    return arr;
  }

  const ROOT_LINE_PLACEHOLDERS = [
    'Most immediate cause…',
    'A layer deeper…',
    'The most fundamental cause…'
  ];

  function rootGroupsHtml(rootCausesText){
    const lines = rootLinesArray(rootCausesText);
    let html = '';
    for (let g=0; g<3; g++){
      html += '<div class="fl-root-group"><div class="fl-root-group-label">Branch '+(g+1)+'</div>';
      for (let l=0; l<3; l++){
        const idx = g*3+l;
        html += '<div class="fl-root-line"><span class="fl-root-num">'+(l+1)+'.</span>' +
          '<input type="text" class="fl-root-input" data-idx="'+idx+'" id="fl-s1-root-'+idx+'" value="'+escapeHtml(lines[idx])+'" placeholder="'+ROOT_LINE_PLACEHOLDERS[l]+'"></div>';
      }
      html += '</div>';
    }
    return html;
  }

  function chipNodeHtml(lines, cls, left, top){
    const filled = (lines || []).filter(Boolean);
    if (!filled.length) return '<div class="fl-t3-node fl-t3-dot" style="left:'+left+';top:'+top+';"></div>';
    const inner = filled.map(t => '<div>'+escapeHtml(t)+'</div>').join('<div class="fl-chip-divider"></div>');
    return '<div class="fl-t3-node" style="left:'+left+';top:'+top+';"><div class="fl-tree-chip '+cls+'">'+inner+'</div></div>';
  }

  function buildTreeHtml(challengeTitle, effects, roots){
    let html = '<div class="fl-tree3">' + TREE_LINES_SVG;
    for (let i=0;i<5;i++){
      const p = pct(BRANCH_POS[i][0], BRANCH_POS[i][1]);
      html += chipNodeHtml([effects[i]], 'fl-effect-chip', p.left, p.top);
    }
    for (let i=0;i<3;i++){
      const p = pct(ROOT_POS[i][0], ROOT_POS[i][1]);
      html += chipNodeHtml([roots[i*3], roots[i*3+1], roots[i*3+2]], ROOT_TIER_CLASS[i], p.left, p.top);
    }
    const trunkP = pct(170,235);
    html += '<div class="fl-t3-node fl-t3-trunk-wrap" style="left:'+trunkP.left+';top:'+trunkP.top+';"><div class="fl-trunk">'+(escapeHtml(challengeTitle) || 'Your challenge')+'</div></div>';
    html += '</div>';
    return html;
  }

  // ---------- Renderers ----------
  function render(){
    document.getElementById('fl-meta-name').value = (data && data.meta.name) || '';
    renderStepper();
    renderStages();
  }

  function renderStepper(){
    const labels = [
      { id: 'summit1', n: 1, t: 'Summit 1' },
      { id: 'summit2', n: 2, t: 'Summit 2' },
      { id: 'summit3', n: 3, t: 'Summit 3' },
      { id: 'manifesto', n: 4, t: 'My Manifesto' }
    ];
    const el = document.getElementById('fl-stepper');
    el.innerHTML = labels.map(l =>
      '<button data-stage="'+l.id+'" class="'+(uiActive===l.id?'fl-active':'')+'" type="button">' +
        '<span class="fl-num">'+l.n+'</span>'+l.t+
      '</button>'
    ).join('');
    el.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => { uiActive = btn.dataset.stage; render(); });
    });
  }

  function renderStages(){
    const container = document.getElementById('fl-stages');
    container.innerHTML =
      '<div class="fl-stage" id="fl-stage-summit1">'+summit1Html()+'</div>' +
      '<div class="fl-stage" id="fl-stage-summit2">'+summit2Html()+'</div>' +
      '<div class="fl-stage" id="fl-stage-summit3">'+summit3Html()+'</div>' +
      '<div class="fl-stage" id="fl-stage-manifesto">'+manifestoHtml()+'</div>';

    document.getElementById('fl-stage-' + uiActive).classList.add('fl-visible');

    document.getElementById('fl-meta-name').oninput = (e) => {
      data.meta.name = e.target.value;
      scheduleSave();
    };

    wireSummit1();
    wireSummit2();
    wireSummit3();
    if (uiActive === 'manifesto') wireManifesto();
  }

  // ---- Summit 1 ----
  function summit1Html(){
    const s = data.summit1;
    const effectsChips = (s.effects||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,5);
    const rootChips = rootLinesArray(s.rootCauses).map(x=>x.trim());
    return '' +
    '<div class="fl-stage-head">' +
      '<div class="fl-kicker">Summit 1 &middot; Go deep on your challenge</div>' +
      '<h2>Map the problem tree</h2>' +
      '<p>Start with what you can see (the effects), then dig underneath to find what\'s really driving it — not just the obvious surface answer.</p>' +
    '</div>' +
    '<div class="fl-grid">' +
      '<div class="fl-card fl-visual-card" id="fl-tree-container">' + buildTreeHtml(s.challengeTitle, effectsChips, rootChips) + '</div>' +
      '<div class="fl-card">' +
        '<label for="fl-s1-title">The challenge, in one line<span class="fl-hint">Name it plainly — you\'ll sharpen it as you go.</span></label>' +
        '<input type="text" id="fl-s1-title" value="'+escapeHtml(s.challengeTitle)+'" placeholder="e.g. Young West Australians are disengaging from democracy">' +

        '<label>The 3S check<span class="fl-hint">Tap each one you believe is true of this challenge.</span></label>' +
        '<div class="fl-3s-row">' +
          '<button type="button" class="fl-3s-chip'+(s.sizeable?' fl-on':'')+'" data-s3s="sizeable">Sizeable<span>Big enough to matter for WA</span></button>' +
          '<button type="button" class="fl-3s-chip'+(s.solvable?' fl-on':'')+'" data-s3s="solvable">Solvable<span>Something a group can move</span></button>' +
          '<button type="button" class="fl-3s-chip'+(s.overlooked?' fl-on':'')+'" data-s3s="overlooked">Sorely overlooked<span>Not already well covered</span></button>' +
        '</div>' +
        '<label for="fl-s1-3s-reasoning">Why?<span class="fl-hint">Explain your reasoning for the 3S check above.</span></label>' +
        '<textarea id="fl-s1-3s-reasoning" rows="2" placeholder="e.g. Sizeable because it affects nearly a third of eligible young voters in WA…">'+escapeHtml(s.threeSReasoning)+'</textarea>' +

        '<label for="fl-s1-effects">What you can see (effects)<span class="fl-hint">One per line, up to 5. The visible symptoms — these become the canopy of your tree.</span></label>' +
        '<textarea id="fl-s1-effects" rows="3" placeholder="e.g. Falling youth voter turnout">'+escapeHtml(s.effects)+'</textarea>' +

        '<label for="fl-s1-consequence">Without action…<span class="fl-hint">The consequence for WA if these effects continue unaddressed.</span></label>' +
        '<textarea id="fl-s1-consequence" rows="2" placeholder="…the next generation will inherit an even wider gap.">'+escapeHtml(s.consequence)+'</textarea>' +

        '<label>What\'s underneath (root causes)<span class="fl-hint">Three groups of three, matching the three branches in your tree. List from most immediate (1) to most fundamental (3) in each group.</span></label>' +
        rootGroupsHtml(s.rootCauses) +

        '<div class="fl-savebar"></div>' +
      '</div>' +
    '</div>' +

    '<div class="fl-vision-hero">' +
      '<div class="fl-vision-kicker">Your Legacy Vision</div>' +
      '<p class="fl-vision-note">This is a first draft — you\'ll flesh this out over the next five weeks.</p>' +
      '<label for="fl-s1-vision" class="fl-vision-label">My/Our vision for WA2050 is a state where…<span class="fl-hint">What has changed, and for whom?</span></label>' +
      '<textarea id="fl-s1-vision" class="fl-vision-textarea" rows="3" placeholder="…young people see themselves as active participants in shaping the state\'s future.">'+escapeHtml(s.vision)+'</textarea>' +
      '<label for="fl-s1-stakeholders" class="fl-vision-label">Key stakeholders to map<span class="fl-hint">One per line. Who else has a stake in this challenge? Add three key stakeholders whom you could reach out to invite to your roundtable during Summit #3.</span></label>' +
      '<textarea id="fl-s1-stakeholders" class="fl-vision-textarea" rows="2" placeholder="e.g. John Smith, Department of Education">'+escapeHtml(s.stakeholders)+'</textarea>' +
    '</div>';
  }

  function wireSummit1(){
    if (uiActive !== 'summit1') return;
    const t = document.getElementById('fl-s1-title');
    const e = document.getElementById('fl-s1-effects');
    const c = document.getElementById('fl-s1-consequence');
    const v = document.getElementById('fl-s1-vision');
    const st = document.getElementById('fl-s1-stakeholders');
    const reasoning3s = document.getElementById('fl-s1-3s-reasoning');
    [ [t,'challengeTitle'], [e,'effects'], [c,'consequence'], [v,'vision'], [st,'stakeholders'], [reasoning3s,'threeSReasoning'] ].forEach(([node,key]) => {
      node.addEventListener('input', () => {
        data.summit1[key] = node.value;
        scheduleSave();
        if (key === 'challengeTitle' || key === 'effects') refreshTreeVisual();
      });
    });
    document.querySelectorAll('#fl-stage-summit1 .fl-root-input').forEach(input => {
      input.addEventListener('input', () => {
        const idx = +input.dataset.idx;
        const arr = rootLinesArray(data.summit1.rootCauses);
        arr[idx] = input.value;
        data.summit1.rootCauses = arr.join('\n');
        scheduleSave();
        refreshTreeVisual();
      });
    });
    document.querySelectorAll('#fl-stage-summit1 .fl-3s-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.s3s;
        data.summit1[key] = !data.summit1[key];
        btn.classList.toggle('fl-on', data.summit1[key]);
        scheduleSave();
      });
    });
  }

  function refreshTreeVisual(){
    const wrap = document.getElementById('fl-tree-container');
    if (!wrap) return;
    const s = data.summit1;
    const effectsChips = (s.effects||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,5);
    const rootChips = rootLinesArray(s.rootCauses).map(x=>x.trim());
    wrap.innerHTML = buildTreeHtml(s.challengeTitle, effectsChips, rootChips);
  }

  // ---- Summit 2 ----
  function quadLabel(control, speed){
    const directNow = control <= 3;
    const fast = speed <= 3;
    if (directNow && fast) return 0;
    if (!directNow && fast) return 1;
    if (directNow && !fast) return 2;
    return 3;
  }

  function summit2Html(){
    const s = data.summit2;
    const active = quadLabel(s.control, s.speed);
    const quads = [
      'Direct action,<br>fast', 'Needs others,<br>fast',
      'Direct action,<br>structural', 'Needs others,<br>structural'
    ];
    return '' +
    '<div class="fl-stage-head">' +
      '<div class="fl-kicker">Summit 2 &middot; Find your pathway to change</div>' +
      '<h2>Choose your pathway(s) of change</h2>' +
      '<p>Hear from the panel of change-makers, then map your challenge against the six pathways below. You can select up to 2 if your approach genuinely combines pathways. Use the sliders as a quick gut-check on how much control you have and how fast change could show up.</p>' +
    '</div>' +
    '<div class="fl-grid">' +
      '<div class="fl-card fl-visual-card">' +
        '<div class="fl-quad-wrap">' +
          '<div class="fl-quad">' + quads.map((q,i)=>'<div class="fl-q'+(i===active?' fl-q-active':'')+'">'+q+'</div>').join('') + '</div>' +
          '<div class="fl-axis-label"><span>More control</span><span>Needs others to act</span></div>' +
          '<label style="margin-top:12px;">How much control do you have?<span class="fl-hint"></span></label>' +
          '<input type="range" min="1" max="5" id="fl-s2-control" value="'+s.control+'">' +

          '<input type="range" min="1" max="5" id="fl-s2-speed" value="'+s.speed+'">' +
        '</div>' +
      '</div>' +
      '<div class="fl-card">' +
        '<label>Pick your pathway(s)<span class="fl-hint">Choose up to 2 pathways that best fit your root cause.</span></label>' +
        '<div class="fl-pathway-options" id="fl-s2-pathways">' +
          PATHWAYS.map(p => '<button type="button" class="fl-pathway-opt'+(s.pathways.indexOf(p.id)>-1?' fl-selected':'')+'" data-pathway="'+p.id+'"><strong>'+escapeHtml(p.label)+'</strong><span>'+escapeHtml(p.desc)+'</span></button>').join('') +

        '<label for="fl-s2-reasoning">Why this pathway fits<span class="fl-hint">Tie it back to the root cause from Summit 1.</span></label>' +
        '<textarea id="fl-s2-reasoning" rows="3" placeholder="This pathway fits because…">'+escapeHtml(s.reasoning)+'</textarea>' +

        '<label for="fl-s2-possible">We believe this is possible because…<span class="fl-hint">The evidence or reason for hope behind your vision.</span></label>' +
        '<textarea id="fl-s2-possible" rows="2" placeholder="…similar models have worked in other states.">'+escapeHtml(s.possibleBecause)+'</textarea>' +

        '<label for="fl-s2-commitment">Our role in pursuing it is to…<span class="fl-hint">The specific commitment you\'re making.</span></label>' +
        '<textarea id="fl-s2-commitment" rows="2" placeholder="…pilot the program with two schools this year.">'+escapeHtml(s.commitment)+'</textarea>' +

        '<label for="fl-s2-mentor">Mentor conversation notes<span class="fl-hint">Optional — capture takeaways from your matched mentor.</span></label>' +
        '<textarea id="fl-s2-mentor" rows="2" placeholder="Key things my mentor pushed me to consider…">'+escapeHtml(s.mentorNotes)+'</textarea>' +

        '<div class="fl-savebar"></div>' +
      '</div>' +
    '</div>';
  }

  function wireSummit2(){
    if (uiActive !== 'summit2') return;
    const control = document.getElementById('fl-s2-control');
    const speed = document.getElementById('fl-s2-speed');
    control.addEventListener('input', () => { data.summit2.control = +control.value; refreshQuad(); scheduleSave(); });
    speed.addEventListener('input', () => { data.summit2.speed = +speed.value; refreshQuad(); scheduleSave(); });

    document.querySelectorAll('#fl-s2-pathways .fl-pathway-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.pathway;
        const idx = data.summit2.pathways.indexOf(id);
        if (idx > -1) {
          data.summit2.pathways.splice(idx, 1);
        } else {
          if (data.summit2.pathways.length >= 2) {
            alert('You can select up to 2 pathways — tap one you\'ve chosen to deselect it first if you want to swap.');
            return;
          }
          data.summit2.pathways.push(id);
        }
        btn.classList.toggle('fl-selected', data.summit2.pathways.indexOf(id) > -1);
        scheduleSave();
      });
    });

    const idea = document.getElementById('fl-s2-idea');
    const reasoning = document.getElementById('fl-s2-reasoning');
    const possible = document.getElementById('fl-s2-possible');
    const commitment = document.getElementById('fl-s2-commitment');
    const mentor = document.getElementById('fl-s2-mentor');
    [ [idea,'idea'], [reasoning,'reasoning'], [possible,'possibleBecause'], [commitment,'commitment'], [mentor,'mentorNotes'] ].forEach(([node,key]) => {
      node.addEventListener('input', () => { data.summit2[key] = node.value; scheduleSave(); });
    });
  }

  function refreshQuad(){
    const s = data.summit2;
    const active = quadLabel(s.control, s.speed);
    document.querySelectorAll('#fl-stage-summit2 .fl-q').forEach((el,i) => el.classList.toggle('fl-q-active', i===active));
  }

    '<div class="fl-vision-hero">' +
      '<div class="fl-vision-kicker">Roundtable Feedback</div>' +

      '<label for="fl-s3-worked" class="fl-vision-label">What worked in your pitch<span class="fl-hint">Feedback from the roundtable.</span></label>' +
      '<textarea id="fl-s3-worked" class="fl-vision-textarea" rows="2" placeholder="e.g. The stakeholders responded well to…">'+escapeHtml(s.whatWorked)+'</textarea>' +
      '<label for="fl-s3-adjust" class="fl-vision-label">What to adjust<span class="fl-hint">What would make it land better for a different audience?</span></label>' +
      '<textarea id="fl-s3-adjust" class="fl-vision-textarea" rows="2" placeholder="e.g. Needs a clearer ask for government stakeholders">'+escapeHtml(s.whatToAdjust)+'</textarea>' +
    '</div>';
  }

  function wireSummit3(){
    if (uiActive !== 'summit3') return;
    document.querySelectorAll('#fl-s3-audience .fl-audience-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const a = btn.dataset.audience;
        const idx = data.summit3.audiences.indexOf(a);
        if (idx > -1) data.summit3.audiences.splice(idx, 1);
        else data.summit3.audiences.push(a);
        btn.classList.toggle('fl-selected', data.summit3.audiences.indexOf(a) > -1);
        scheduleSave();
      });
    });
    const contacts = document.getElementById('fl-s3-contacts');
    const worked = document.getElementById('fl-s3-worked');
    const adjust = document.getElementById('fl-s3-adjust');
    const self = document.getElementById('fl-s3-self');
    const us = document.getElementById('fl-s3-us');
    const now = document.getElementById('fl-s3-now');
    [ [contacts,'contacts'], [worked,'whatWorked'], [adjust,'whatToAdjust'], [self,'self'], [us,'us'], [now,'now'] ].forEach(([node,key]) => {
      node.addEventListener('input', () => { data.summit3[key] = node.value; scheduleSave(); });
    });
  }

  // ---- Manifesto stage ----
  function draftBrief(){
    const s1 = data.summit1, s2 = data.summit2, s3 = data.summit3;
    data.brief.challengeText = 'We believe Western Australia faces a challenge of ' + (s1.challengeTitle || '[your challenge]') + '. At its core, this is driven by ' + (joinLines(s1.rootCauses, '; ') || '[root cause]') + '. Without action, ' + (s1.consequence || '[consequence for WA]') + (s3.self ? ' This matters to us personally: ' + s3.self : '') + '.';
    data.brief.visionText = (s1.vision || 'A WA where…') + ' We believe this is possible because ' + (s2.possibleBecause || '[evidence or reason for hope]') + (s3.us ? ' ' + s3.us : '') + '.';
    data.brief.pathwayText = 'The most effective pathway to create this change is through ' + (pathwayLabels(s2.pathways) || '[your chosen pathway]') + '. Our role in pursuing it is to ' + (s2.commitment || '[your commitment]') + '.' + (s2.idea ? ' Specifically: ' + s2.idea : '') + (s3.now ? ' ' + s3.now : '');
  }

  function hasAnyContent(){
    const s1 = data.summit1, s2 = data.summit2, s3 = data.summit3, b = data.brief;
    return !!(s1.challengeTitle || s1.vision || s2.idea || s3.self || b.challengeText || b.visionText || b.pathwayText);
  }

  function manifestoHtml(){
    if (!hasAnyContent()){
      return '<div class="fl-stage-head">' +
        '<div class="fl-kicker">Your WA2050 Manifesto</div>' +
        '<h2>Your manifesto will take shape here</h2>' +
        '<p>Come back once you\'ve worked through Summits #1-3 - this is where it all comes together into your Legacy Brief and your vision to be presented at Ripple Legacy Night.</p>' +
      '</div>';
    }
    const b = data.brief;
    return '' +
    '<div class="fl-stage-head">' +
      '<div class="fl-kicker">Your WA2050 Manifesto</div>' +
      '<h2>Bring it together</h2>' +
      '<p>Draft your three-part Legacy Brief from your summit answers, then polish the wording. This becomes both your printed Legacy Brief and your Legacy Night story — download it as a Word document to send to your program coordinator.</p>' +
    '</div>' +

    '<div class="fl-brief-editor fl-card">' +
      '<div class="fl-brief-actions">' +
        '<button class="fl-btn fl-btn-ghost" id="fl-draft-btn" type="button">Draft from my summit answers</button>' +
      '</div>' +
      '<div class="fl-brief-field"><label for="fl-brief-challenge">The Core Challenge</label><textarea id="fl-brief-challenge" placeholder="Draft from your answers, then polish the wording here.">'+escapeHtml(b.challengeText)+'</textarea></div>' +
      '<div class="fl-brief-field"><label for="fl-brief-vision">The Vision — WA 2050</label><textarea id="fl-brief-vision">'+escapeHtml(b.visionText)+'</textarea></div>' +
      '<div class="fl-brief-field"><label for="fl-brief-pathway">The Pathway to Change</label><textarea id="fl-brief-pathway">'+escapeHtml(b.pathwayText)+'</textarea></div>' +
      '<div class="fl-savebar"></div>' +
    '</div>' +

    '<div class="fl-view-toggle">' +
      '<button class="fl-btn fl-btn-ghost'+(uiStoryView==='story'?' fl-btn-on':'')+'" id="fl-view-story" type="button">Story view</button>' +
      '<button class="fl-btn fl-btn-ghost'+(uiStoryView==='brief'?' fl-btn-on':'')+'" id="fl-view-brief" type="button">Printed brief view</button>' +
      '<button class="fl-btn fl-btn-primary" id="fl-download-doc" type="button">Download Word brief (.doc)</button>' +
    '</div>' +

    '<div id="fl-manifesto-view">' + (uiStoryView === 'brief' ? briefPreviewHtml() : storyHtml(data.summit1, data.brief)) + '</div>';
  }

  function briefPreviewHtml(){
    const b = data.brief;
    const name = data.meta.name || 'Your Legacy Brief';
    return '<div class="fl-brief-preview">' +
      '<div class="fl-bp-title">'+escapeHtml(data.summit1.challengeTitle || name)+'</div>' +
      '<div class="fl-bp-sub">WA2050 Manifesto &middot; '+escapeHtml(name)+'</div>' +
      '<div class="fl-bp-box fl-bp-neutral"><h4>The Core Challenge</h4><p>'+escapeHtml(b.challengeText || 'Draft your challenge paragraph above.')+'</p></div>' +
      '<div class="fl-bp-box fl-bp-neutral"><h4>The Vision — WA 2050</h4><p>'+escapeHtml(b.visionText || 'Draft your vision paragraph above.')+'</p></div>' +
      '<div class="fl-bp-box fl-bp-accent"><h4>The Pathway to Change</h4><p>'+escapeHtml(b.pathwayText || 'Draft your pathway paragraph above.')+'</p></div>' +
    '</div>';
  }

  function wireManifesto(){
    if (uiActive !== 'manifesto') return;
    if (!hasAnyContent()) return;

    document.getElementById('fl-draft-btn').addEventListener('click', () => {
      if (data.brief.challengeText || data.brief.visionText || data.brief.pathwayText) {
        if (!confirm('This will overwrite your current brief text with a fresh draft from your summit answers. Continue?')) return;
      }
      draftBrief();
      scheduleSave();
      renderStages();
    });

    const ch = document.getElementById('fl-brief-challenge');
    const vi = document.getElementById('fl-brief-vision');
    const pa = document.getElementById('fl-brief-pathway');
    [ [ch,'challengeText'], [vi,'visionText'], [pa,'pathwayText'] ].forEach(([node,key]) => {
      node.addEventListener('input', () => {
        data.brief[key] = node.value;
        scheduleSave();
        const view = document.getElementById('fl-manifesto-view');
        if (view) view.innerHTML = uiStoryView === 'brief' ? briefPreviewHtml() : storyHtml(data.summit1, data.brief);
        if (uiStoryView === 'story') initStoryScroll();
      });
    });

    document.getElementById('fl-view-story').addEventListener('click', () => { uiStoryView = 'story'; renderStages(); });
    document.getElementById('fl-view-brief').addEventListener('click', () => { uiStoryView = 'brief'; renderStages(); });
    document.getElementById('fl-download-doc').addEventListener('click', downloadWordBrief);

    if (uiStoryView === 'story') initStoryScroll();
  }

  // ---- Story mode (scrollytelling) ----
  function storyHtml(summit1, brief){
    let sections = '';
    sections += '<div class="fl-story-section fl-hero"><div class="fl-story-eyebrow">Fogarty Ripple &middot; WA2050</div><h3>'+escapeHtml(summit1.challengeTitle || 'What will be your legacy for WA?')+'</h3></div>';
    if (brief.challengeText) sections += '<div class="fl-story-section"><div class="fl-story-eyebrow">The Core Challenge</div><h3>What\'s really going on</h3><p>' + escapeHtml(brief.challengeText) + '</p></div>';
    if (brief.visionText) sections += '<div class="fl-story-section"><div class="fl-story-eyebrow">The Vision — WA 2050</div><p class="fl-story-vision">' + escapeHtml(brief.visionText) + '</p></div>';
    if (brief.pathwayText) sections += '<div class="fl-story-section"><div class="fl-story-eyebrow">The Pathway to Change</div><p>' + escapeHtml(brief.pathwayText) + '</p></div>';
    sections += '<div class="fl-story-section fl-closing">&ldquo;The future will be shaped by those who decided to do something about it.&rdquo;</div>';
    return '<div id="fl-story"><div class="fl-stars"></div><div class="fl-torch" id="fl-torch"></div><div class="fl-story-inner">' + sections + '</div></div>';
  }

  let storyObserver = null;
  function initStoryScroll(){
    const storyEl = document.getElementById('fl-story');
    if (!storyEl) return;
    const sections = storyEl.querySelectorAll('.fl-story-section');
    const torch = document.getElementById('fl-torch');

    if (storyObserver) storyObserver.disconnect();
    storyObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('fl-visible'); });
    }, { threshold: 0.2 });
    sections.forEach(s => storyObserver.observe(s));

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (torch && !reduceMotion) {
      const onScroll = () => {
        const rect = storyEl.getBoundingClientRect();
        const progress = Math.min(Math.max((-rect.top + window.innerHeight * 0.4) / Math.max(rect.height,1), 0), 1);
        torch.style.top = (progress * rect.height) + 'px';
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    } else if (torch) {
      torch.style.display = 'none';
    }
  }

  // ---- Word (.doc via RTF) export ----
  function rtfEscape(str){
    return String(str||'')
      .replace(/\\/g, '\\\\')
      .replace(/{/g, '\\{')
      .replace(/}/g, '\\}')
      .replace(/\r?\n/g, '\\par ')
      .replace(/[^\x00-\x7F]/g, function(c){ return '\\u' + c.charCodeAt(0) + '?'; });
  }

  function rtfSection(heading, body, accent){
    const borderColor = accent ? 3 : 2;
    return '{\\pard\\brdrl\\brdrs\\brdrw80\\brdrcf' + borderColor + '\\sa60\\li160' +
      '{\\b\\f1\\fs22\\cf2 ' + rtfEscape(heading.toUpperCase()) + '\\par}' +
      '{\\f0\\fs23\\cf1 ' + rtfEscape(body || '') + '\\par}' +
      '\\par}';
  }

  function briefBodyRtf(challengeText, visionText, pathwayText){
    return rtfSection('The Core Challenge', challengeText, false) +
           rtfSection('The Vision — WA 2050', visionText, false) +
           rtfSection('The Pathway to Change', pathwayText, true);
  }

  function triggerDocDownload(rtf, filename){
    const blob = new Blob([rtf], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function downloadWordBrief(){
    const b = data.brief;
    const s1 = data.summit1;
    const title = s1.challengeTitle || 'My WA2050 Manifesto';
    const author = data.meta.name || '';
    const dateStr = new Date().toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });

    const rtf =
      '{\\rtf1\\ansi\\deff0' +
      '{\\fonttbl{\\f0 Calibri;}{\\f1 Arial;}}' +
      '{\\colortbl;\\red28\\green18\\blue35;\\red81\\green37\\blue90;\\red255\\green129\\blue33;}' +
      '\\f1\\fs40\\b\\cf2 ' + rtfEscape(title) + '\\par' +
      '\\f0\\fs20\\b0\\cf1 WA2050 Manifesto' + (author ? '  \\u8226? ' + rtfEscape(author) : '') + '  \\u8226? ' + rtfEscape(dateStr) + '\\par\\par' +
      briefBodyRtf(b.challengeText, b.visionText, b.pathwayText) +
      '\\par{\\i\\f0\\fs20\\cf1 "The future will be shaped by those who decided to do something about it."\\par}' +
      '}';

    const safeName = (title || 'legacy-brief').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    triggerDocDownload(rtf, 'legacy-brief-' + (safeName || 'wa2050') + '.doc');
  }

  // ---- Init ----
  storageAvailable = checkStorageAvailable();
  if (!storageAvailable) {
    document.getElementById('fl-storage-warning').style.display = 'block';
  }
  loadData();
  render();
})();
</script>
</body>
</html>
